[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "vaptforge"
version = "0.1.0"
description = "Authorized VAPT orchestration, finding normalization, correlation, and reporting framework."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Shadin K V" }]
dependencies = [
  "fastapi>=0.115",
  "httpx>=0.28",
  "pydantic>=2.10",
  "rich>=13.9",
  "typer>=0.15",
  "uvicorn>=0.34",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "pytest-cov>=6.0",
  "ruff>=0.9",
]

[project.scripts]
vaptforge = "vaptforge.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/vaptforge"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --disable-warnings --maxfail=1"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "S"]
ignore = ["S603"]
